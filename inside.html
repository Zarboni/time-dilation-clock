<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside the Singularity</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Titillium Web", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #02060e;
        color: #e7eef9;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .fog-layer {
        position: fixed;
        inset: -20%;
        background: radial-gradient(circle at 30% 30%, rgba(120, 190, 255, 0.05), transparent 55%),
          radial-gradient(circle at 70% 60%, rgba(90, 140, 200, 0.06), transparent 60%);
        mix-blend-mode: screen;
        opacity: 0.25;
        filter: blur(24px);
        pointer-events: none;
        z-index: 1;
      }
      .fog-layer.layer-2 {
        opacity: 0.18;
        filter: blur(28px);
      }
      .fog-layer.layer-3 {
        opacity: 0.12;
        filter: blur(32px);
      }
      #particleOverlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .ui {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem;
        pointer-events: none;
        text-align: center;
      }
      .title {
        font-family: "Orbitron", "Titillium Web", sans-serif;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        font-size: clamp(1.2rem, 2vw, 1.6rem);
        opacity: 0.85;
      }
      .instructions {
        font-size: clamp(0.9rem, 1.6vw, 1rem);
        color: rgba(231, 238, 249, 0.75);
      }
      .crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        margin-top: -7px;
        border: 1px solid rgba(231, 238, 249, 0.45);
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(111, 228, 255, 0.5);
        pointer-events: none;
      }
      .crosshair.moving {
        box-shadow: 0 0 10px rgba(111, 228, 255, 0.8);
      }
      .back-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(111, 228, 255, 0.4);
        background: rgba(6, 12, 22, 0.5);
        color: #e7eef9;
        text-decoration: none;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        pointer-events: auto;
      }
      #message {
        position: fixed;
        bottom: 1.4rem;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.35rem 0.8rem;
        border-radius: 8px;
        background: rgba(6, 12, 22, 0.65);
        border: 1px solid rgba(111, 228, 255, 0.3);
        color: #e7eef9;
        font-size: 0.95rem;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #message.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="fog-layer layer-1"></div>
    <div class="fog-layer layer-2"></div>
    <div class="fog-layer layer-3"></div>
    <canvas id="particleOverlay"></canvas>
    <a class="back-link" href="index.html">Back to Timefall</a>
    <div class="ui">
      <div class="title">Inside the Singularity</div>
      <div class="instructions">Click to lock pointer • WASD move • Mouse look • E interact • Esc unlock</div>
    </div>
    <div class="crosshair"></div>
    <div id="message"></div>
    <audio id="humAudio" preload="auto"></audio>
    <script type="module" src="inside.js"></script>
  </body>
  </html>
