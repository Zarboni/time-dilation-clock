<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timefall | Relativistic Racer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Titillium Web", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050a12;
        color: #e7eef9;
      }
      #racerCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: radial-gradient(circle at 50% 30%, rgba(30, 60, 90, 0.2), rgba(5, 10, 18, 0.9));
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hud-top {
        display: flex;
        justify-content: space-between;
        padding: 0.8rem 1rem;
      }
      .glass {
        background: rgba(8, 16, 28, 0.6);
        border: 1px solid rgba(111, 228, 255, 0.4);
        border-radius: 12px;
        padding: 0.5rem 0.75rem;
        box-shadow: 0 12px 30px rgba(111, 228, 255, 0.2);
      }
      .hud-label {
        font-family: "Orbitron", "Titillium Web", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        font-size: 0.85rem;
      }
      .value {
        font-size: 1rem;
        color: #9fe6ff;
      }
      .bar {
        position: relative;
        width: 180px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: 0.35rem;
      }
      .bar-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        transform-origin: left;
        background: linear-gradient(90deg, #4ad5ff, #58ffd5);
      }
      .btn-row {
        display: flex;
        gap: 0.5rem;
      }
      .hud-btn {
        pointer-events: auto;
        cursor: pointer;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(111, 228, 255, 0.5);
        background: rgba(8, 16, 28, 0.7);
        color: #e7eef9;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        box-shadow: 0 8px 20px rgba(111, 228, 255, 0.2);
      }
      .hud-btn:hover {
        border-color: rgba(185, 149, 255, 0.7);
        box-shadow: 0 12px 30px rgba(111, 228, 255, 0.3);
      }
      .hud-bottom {
        display: flex;
        justify-content: center;
        padding-bottom: 0.8rem;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 10, 18, 0.7);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }
      .overlay-card {
        background: rgba(8, 16, 28, 0.8);
        border: 1px solid rgba(111, 228, 255, 0.5);
        border-radius: 16px;
        padding: 1.5rem 2rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .overlay-title {
        font-family: "Orbitron", "Titillium Web", sans-serif;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      .overlay-sub {
        margin: 0 0 1rem;
        color: rgba(231, 238, 249, 0.8);
      }
    </style>
  </head>
  <body>
    <canvas id="racerCanvas"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="glass">
          <div class="hud-label">Arrival in</div>
          <div class="value" id="arrivalText">01:15</div>
        </div>
        <div class="glass">
          <div class="hud-label">Stability</div>
          <div class="bar"><div class="bar-fill" id="stabilityFill"></div></div>
        </div>
        <div class="btn-row">
          <button class="hud-btn" id="retryBtn">Retry</button>
          <button class="hud-btn" id="backBtn">Back to Timefall</button>
        </div>
      </div>
      <div class="hud-bottom">
        <div class="glass">
          <div class="hud-label">Controls</div>
          <div class="value">A/D steer • W boost • S brake</div>
        </div>
      </div>
    </div>
    <div class="overlay" id="endOverlay">
      <div class="overlay-card">
        <div class="overlay-title" id="endTitle">Event horizon reached</div>
        <div class="overlay-sub">Level complete.</div>
        <div class="btn-row" style="justify-content:center;">
          <button class="hud-btn" id="continueBtn">Return</button>
        </div>
      </div>
    </div>
    <script type="module" src="racer.js"></script>
  </body>
  </html>
